<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loot Drop">
<title>Loot Drop</title>
<style>
/* Layout idea: one-screen phone app. Fixed header and bottom tabs, one scrolling column of
   signal cards between them, bottom sheets for detail, sizing and settings. System fonts only. */
:root{
  --bg:#edf0f5; --surface:#ffffff; --surface2:#e2e7ef; --ink:#121a27; --muted:#566277; --line:#cfd6e1;
  --accent:#a85f00; --accent-ink:#ffffff; --up:#0a7558; --down:#bf352e; --warn-bg:#fbe9e7;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d131c; --surface:#151d29; --surface2:#1f2a3a; --ink:#e7ecf3; --muted:#8d9ab0; --line:#293447;
    --accent:#f0a63a; --accent-ink:#1b1203; --up:#3fcc9e; --down:#ff7d6e; --warn-bg:#2a1a1c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d131c; --surface:#151d29; --surface2:#1f2a3a; --ink:#e7ecf3; --muted:#8d9ab0; --line:#293447;
  --accent:#f0a63a; --accent-ink:#1b1203; --up:#3fcc9e; --down:#ff7d6e; --warn-bg:#2a1a1c; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
main>*,.sheet-body>*{flex:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .acc{color:var(--accent);font-weight:600}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}

header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.brand span{color:var(--accent)}
.pill{font-family:var(--font-num);font-size:11px;font-weight:600;letter-spacing:.03em;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);white-space:nowrap;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block;flex:none}
.pill.sim i{background:var(--accent)} .pill.live i{background:var(--up)} .pill.err i{background:var(--down)}
.pill.err{border-color:var(--down);background:var(--warn-bg)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner{padding:8px 16px;background:color-mix(in srgb,var(--accent) 14%,var(--bg));border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center}
.banner.bad{background:var(--warn-bg)}
.banner p{margin:0;flex:1}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;text-wrap:balance}
.summary{display:flex;gap:10px;align-items:center}
.summary b{font-family:var(--font-num);font-size:24px;font-weight:600}
.summary span{font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:baseline;gap:8px}
.row.mid{align-items:center}
.small{font-size:12.5px}
.sym{font-weight:700;font-size:17px;letter-spacing:.01em}
.grow{flex:1;min-width:0}
.side{font-size:11px;font-weight:700;letter-spacing:.07em;padding:2px 6px;border-radius:4px;color:var(--up);border:1px solid currentColor}
.side.short{color:var(--down)}

.sig{display:flex;flex-direction:column;gap:7px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.sig.dead{opacity:.6}
.sig.dead .side,.sig.dead .sym{color:var(--muted)}
.tier{font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;white-space:nowrap}
.tier.leg{background:#ff9a3d;color:#1b1203} .tier.epic{background:#b69cff;color:#1a1033} .tier.rare{background:#f2d14b;color:#2a2203}
.tier.unc{background:#6fcf6f;color:#0c2410} .tier.com{background:#9aa3b2;color:#10151d} .tier.off{background:var(--surface2);color:var(--muted)}
.sig.live.leg{border-color:#ff9a3d} .sig.live.epic{border-color:#b69cff} .sig.live.rare{border-color:#d9b92e} .sig.live.unc{border-color:#6fcf6f} .sig.live.com{border-color:#9aa3b2}
.levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.levels div{background:var(--surface2);padding:7px 10px;display:flex;flex-direction:column}
.levels small{font-size:11px;color:var(--muted)}
.levels span{font-family:var(--font-num);font-size:15px}
.fresh{animation:pop .5s ease-out}
@keyframes pop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fresh{animation:none}.sheet{transition:none!important}}

.card{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .stat{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.switch{flex:none;width:46px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.block{width:100%;padding:12px;min-height:48px}
.legend{display:flex;gap:5px;font-size:11px;font-weight:700}
.legend .tier{flex:1;text-align:center;padding:4px 0}
input[type=range]{width:100%;height:36px;margin:0;accent-color:var(--accent)}

.table{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.trow{display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:baseline;padding:10px 12px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.trow:first-child{border-top:0}
.trow .rank{font-family:var(--font-num);font-size:12px;color:var(--muted)}
.trow .nm{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.trow .val{min-width:70px;text-align:right}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:14px}
.news{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.news .hl{font-weight:600;font-size:15px;line-height:1.3;text-wrap:balance;color:inherit}
.news .meta{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:4px 8px;border-radius:5px;background:var(--surface2);color:var(--ink);border:0}

nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;position:relative}
nav a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a[aria-current="page"]{color:var(--ink)}
nav a[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-num);font-size:10.5px;display:grid;place-items:center;padding:0 4px}

.scrim{position:fixed;inset:0;background:rgba(5,9,15,.5);display:none;z-index:10}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;background:var(--bg);border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0;z-index:11;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease-out;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-size:17px;flex:1;min-width:0}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.legendtxt{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=password],.field input[type=number],.field select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px;font-size:16px;width:100%;min-width:0;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:9px 6px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-left:1px solid var(--line)}
.seg label:first-of-type{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + label{background:var(--ink);color:var(--bg)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:-2px}
.check{display:flex;gap:10px;align-items:center;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.msg{font-size:13.5px;padding:9px 11px;border-radius:9px;background:var(--surface2)}
.msg.bad{color:var(--down)} .msg.good{color:var(--up)}
.warn{padding:11px 12px;border-radius:10px;border:1px solid var(--down);background:var(--warn-bg);font-size:14px}
.note{font-size:13px;color:var(--muted);margin:0;max-width:65ch}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{background:var(--surface);padding:9px 11px;display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.stats div span:first-child{color:var(--muted)}
.rows{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.rows>div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.rows>div:first-child{border-top:0}
.bar{width:84px;height:6px;border-radius:3px;background:var(--surface2);flex:none}
.bar i{display:block;height:6px;border-radius:3px;background:var(--accent)}
.big{font-family:var(--font-num);font-size:30px;font-weight:600;letter-spacing:-.02em}
.spark{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.symchips{display:flex;flex-wrap:wrap;gap:6px}
.symchip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 4px 5px 9px;font-weight:600;font-size:13.5px}
.symchip button{border:0;background:none;padding:0 5px;font-size:16px;line-height:1;color:var(--muted)}
.symchip.lock{padding-right:9px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Loot <span>Drop</span></div>
    <div class="pill sim" id="status"><i></i><span id="statusText">STARTING</span></div>
    <button class="iconbtn" data-act="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.8H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.8-1.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.8h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.1z"/></svg>
    </button>
  </header>
  <div class="banner" id="banner" hidden><p id="bannerText"></p><button class="linkbtn" id="bannerBtn" data-act="open-settings">Connect Alpaca</button></div>
  <main id="main"></main>
  <nav aria-label="Sections">
    <a href="#alerts" data-view="alerts"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Alerts<span class="badge" id="badge" hidden>0</span></a>
    <a href="#setups" data-view="setups"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Setups</a>
    <a href="#rankings" data-view="rankings"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Rankings</a>
    <a href="#news" data-view="news"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h10M7 16h7"/></svg>News</a>
  </nav>
</div>
<div class="scrim" id="scrim" data-act="close-sheet"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="btn small" data-act="close-sheet">Close</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<script id="engine">
/* ===== Loot Drop signal engine: no page access, so it can be tested on its own ===== */
const ET = (() => {
  const f = new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York', hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const cache = new Map();
  function offset(ms){
    const k = Math.floor(ms / 21600000);
    let o = cache.get(k);
    if (o === undefined){
      const p = {}; for (const x of f.formatToParts(new Date(ms))) p[x.type] = x.value;
      o = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000;
      cache.set(k, o);
    }
    return o;
  }
  function parts(ms){ const d = new Date(ms + offset(ms)); return {key: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes(), dow: d.getUTCDay()}; }
  function time(ms){ const m = parts(ms).min; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  function open(key){ const [y, m, d] = key.split('-').map(Number); const g = Date.UTC(y, m - 1, d, 9, 30); return g - offset(g); }
  return {offset, parts, time, open};
})();

const TICK = 0.01, R_TARGET = 1.5, VALID_BARS = 2, MAX_HOLD = 10, COOLDOWN = 10;
const ORDER = ['pullback', 'orb', 'compress', 'sweep'];
const SETUPS = {
  pullback:{name:'VWAP + EMA pullback', volThr:1.3, desc:'Dip toward the 9 EMA inside a trend, then a close past the prior bar on 1.3× volume.'},
  orb:{name:'5-minute ORB + retest', volThr:1.5, desc:'Break of the 9:30 to 9:35 range, a retest that holds within 5 bars, then a resume.'},
  compress:{name:'Momentum compression breakout', volThr:1.5, desc:'A 0.6% push in 5 minutes, 3 to 6 tight bars, then a breakout on 1.5× volume.'},
  sweep:{name:'Liquidity sweep + reclaim', volThr:1.5, desc:'A brief break of a key low or high that closes back within 2 bars. Counter-trend.'},
};
const TIERS = [[90, 'Legendary', 'leg'], [80, 'Epic', 'epic'], [70, 'Rare', 'rare'], [55, 'Uncommon', 'unc'], [0, 'Common', 'com']];
const tierOf = score => TIERS.find(t => score >= t[0]);
const mean = a => { let x = 0; for (const v of a) x += v; return x / a.length; };
const clamp01 = x => Math.max(0, Math.min(1, x));
const r2 = n => Math.round(n * 100) / 100;

function orRange(s, p){
  const last = s.bars[s.bars.length - 1];
  if (!last || last.m < p) return null;
  if (s.or[p] !== undefined) return s.or[p];
  let h = -Infinity, l = Infinity;
  for (const b of s.bars){ if (b.m >= p) break; if (b.h > h) h = b.h; if (b.l < l) l = b.l; }
  return (s.or[p] = h === -Infinity ? null : {h, l});
}

/* A view of the bars for direction d. For puts (d = -1) every price is negated, so each
   detector is written once, as the call rule, and works for both directions. */
function view(s, d){
  const B = s.bars;
  return {i: B.length - 1,
    h: i => d > 0 ? B[i].h : -B[i].l, l: i => d > 0 ? B[i].l : -B[i].h, c: i => d * B[i].c,
    v: i => B[i].v, av: i => B[i].av, e9: i => d * B[i].e9, e20: i => d * B[i].e20, vw: i => d * B[i].vw};
}

const DETECT = {
  pullback(s, d, V){
    const i = V.i, atr = s.atr;
    if (i < 8 || !atr || s.c5 == null) return null;
    if (!(d * s.c5 > V.vw(i))) return null;                       // 5-minute close on the right side of VWAP
    if (!(V.e9(i) > V.e20(i))) return null;                       // EMA 9 past EMA 20
    if (!(V.vw(i) > V.vw(i - 5))) return null;                    // VWAP sloping the right way over 5 bars
    if (!(V.c(i) > V.h(i - 1))) return null;                      // confirmation closes past the prior bar
    if (!(s.avgVol > 0 && V.v(i) >= 1.3 * s.avgVol)) return null;
    for (let k = 2; k <= 5; k++){                                 // a 2 to 5 bar pullback before the confirmation
      const p = i - 1 - k; if (p < 0) break;
      const H = V.h(p); let ok = true, near = false, low = Infinity;
      for (let j = i - k; j <= i - 1; j++){
        if (V.h(j) > H || V.c(j) < V.vw(j)){ ok = false; break; }
        if (V.l(j) - V.e9(j) <= 0.15 * atr) near = true;
        if (V.l(j) < low) low = V.l(j);
      }
      if (!ok || !near || !(V.c(i - 1) < H)) continue;
      if (V.c(i) - V.e9(i) > 0.75 * atr) return null;             // already stretched away from the EMA
      return {entry: V.h(i) + TICK, stop: Math.min(low, V.l(i)) - 0.1 * atr, needRoom: true};
    }
    return null;
  },
  orb(s, d, V){
    const i = V.i, atr = s.atr;
    if (!atr || i < 1) return null;
    const r = orRange(s, 5); if (!r) return null;
    const lvl = d > 0 ? r.h : -r.l, st = s.orb[d];
    if (!st){

      <div class="field"><label for="kFeed">Feed</label><select id="kFeed"><option value="iex" ${settings.feed === 'iex' ? 'selected' : ''}>IEX (free plan, 30 symbols)</option><option value="sip" ${settings.feed === 'sip' ? 'selected' : ''}>SIP (paid plan, all exchanges)</option></select></div>
      <label class="check"><input type="checkbox" id="kRemember" ${settings.remember ? 'checked' : ''}>Remember keys on this device</label>
      <div class="row mid"><button class="btn primary grow" data-act="connect">Connect</button><button class="btn" data-act="forget">Forget keys</button></div>
      <div class="msg ${ui.liveState === 'error' ? 'bad' : ui.liveState === 'live' ? 'good' : ''}" id="liveMsg" ${ui.liveMsg ? '' : 'hidden'}>${esc(ui.liveMsg)}</div>
      <p>Keys go straight from this page to Alpaca and are stored only in this browser. Loot Drop reads market data and never places orders, but Alpaca keys can trade, so keys from a paper account are the safer choice. The free plan allows one live stream at a time, so close Pocket Scanner while this is connected.</p>
    </div>
    <div class="field"><span class="legendtxt">My symbols (<span id="symCount">${symbols.length}</span> of ${limit}${settings.feed === 'iex' ? ' on the free feed' : ''})</span>
      <div class="symchips" id="symChips">${symChips()}</div>
      <div class="row mid"><input type="text" id="symAdd" placeholder="Add tickers, e.g. CRM, SNOW" autocapitalize="characters" autocomplete="off" spellcheck="false" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px;font-size:16px;min-height:44px"><button class="btn" data-act="add-syms">Add</button></div>
      <div class="msg bad" id="symMsg" hidden></div></div>
    <div class="field"><span class="legendtxt">While scanning</span>
      <label class="check"><input type="checkbox" id="optSound" ${settings.sound ? 'checked' : ''}>Beep when a signal meets your minimum score</label>
      <label class="check"><input type="checkbox" id="optAwake" ${settings.awake ? 'checked' : ''}>Keep the screen awake</label></div>
    <p class="note">Signals only arrive while this app is open on screen. It watches the regular session, 9:30 to 16:00 Eastern, on one-minute bars, so a signal appears after its bar closes. For learning only, not financial advice. Options can lose their whole value quickly.</p>`;
}
const symChips = () => symbols.map(s => s === 'SPY' ? `<span class="symchip lock" title="Needed for market alignment">SPY</span>` : `<span class="symchip">${esc(s)}<button data-act="rm-sym" data-id="${esc(s)}" aria-label="Remove ${esc(s)}">×</button></span>`).join('');
function symbolsChanged(){
  store.set('symbols', symbols);
  if ($('symChips')){ $('symChips').innerHTML = symChips(); $('symCount').textContent = symbols.length; }
  if (settings.mode === 'live') connectLive(); else startSim();
}
function addSymbols(raw){
  const limit = settings.feed === 'iex' && settings.mode === 'live' ? 30 : 500, msg = $('symMsg');
  const add = String(raw).toUpperCase().split(/[\s,;]+/).filter(x => /^[A-Z][A-Z.]{0,5}$/.test(x) && !symbols.includes(x));
  if (!add.length){ if (msg){ msg.hidden = false; msg.textContent = 'Enter one or more tickers that are not already on the list.'; } return; }
  const room = limit - symbols.length;
  if (room <= 0){ if (msg){ msg.hidden = false; msg.textContent = `The free IEX feed streams ${limit} symbols. Remove one first, or switch to SIP.`; } return; }
  symbols.push(...add.slice(0, room)); if (msg) msg.hidden = true; if ($('symAdd')) $('symAdd').value = '';
  symbolsChanged();
}

/* ---------- signal side effects ---------- */
let audio = null;
function beep(){ try { if (!audio) return; const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.0001, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.2, audio.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.25); o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.27); } catch (e){} }
let wake = null;
async function setAwake(on){ try { if (on && navigator.wakeLock){ wake = await navigator.wakeLock.request('screen'); } else if (wake){ await wake.release(); wake = null; } } catch (e){} }
engine.onSignal = (g, opts) => {
  if (settings.mode === 'sim'){ notes.unshift({t:g.t, sym:g.sym, text:`${g.sym} ${g.dir > 0 ? 'call' : 'put'} signal from ${g.name}, scored ${g.score}, with entry ${g.dir > 0 ? 'above' : 'below'} ${fmtP(g.entry)}`}); if (notes.length > 60) notes.pop(); }
  if (opts.live && g.score >= settings.minScore){ ui.freshId = g.id; if (ui.view !== 'alerts') ui.unseen++; if (settings.sound) beep(); }
};

/* ---------- practice mode ---------- */
let simTimer = null, sim = null, simDayOpen = 0, simMin = 0;
function stopSim(){ clearInterval(simTimer); simTimer = null; }
function simStep(opts){
  if (simMin >= 390){ simDayOpen = ET.open(ET.parts(simDayOpen + 30 * 3600000).key); simMin = 0; sim.newDay(); engine.signals = []; notes.length = 0; engine.alertFrom = ET.parts(simDayOpen).key; }
  const t = simDayOpen + simMin * 60000;
  for (const s of symbols) engine.onBar(s, sim.bar(s, t, simMin), opts);
  simMin++;
}
function startSim(){
  stopLive(); stopSim(); engine.reset(); notes.length = 0; sim = createSim();
  const today = ET.parts(Date.now()).key;
  simDayOpen = ET.open(ET.parts(ET.open(today) - 20 * 3600000).key); simMin = 0;
  engine.alertFrom = today;
  for (let i = 0; i < 390; i++) simStep({});              // previous day, for prior levels and usual volume
  simMin = 390;
  for (let i = 0; i < 75; i++) simStep({});               // today up to 10:45
  simTimer = setInterval(() => { if (!document.hidden){ simStep({live:true}); invalidate(); } }, 2000);
  invalidate();
}

/* ---------- live mode (Alpaca) ---------- */
const live = {ws:null, retry:null, gen:0, pollM:null, pollN:null};
async function api(path, params){
  const u = new URL('https://data.alpaca.markets' + path);
  for (const [k, v] of Object.entries(params || {})) if (v != null && v !== '') u.searchParams.set(k, v);
  let r;
  try { r = await fetch(u, {headers:{'APCA-API-KEY-ID':keys.id, 'APCA-API-SECRET-KEY':keys.secret}}); }
  catch (e){ const err = new Error('blocked'); err.blocked = true; throw err; }
  if (!r.ok){ const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
  return r.json();
}
function explain(e){
  if (e.blocked) return 'This page could not reach Alpaca. Inside the Claude app outside connections are blocked, so live data only works from your own hosted copy of this page. Staying in practice mode.';
  if (e.status === 401 || e.status === 403) return 'Alpaca rejected those keys. Check the key ID and secret, and that the feed matches your plan.';
  if (e.status === 429) return 'Alpaca is rate limiting requests. Wait a minute and connect again.';
  return 'Alpaca returned an error (' + (e.status || e.message) + ').';
}
function setLive(state, msg){ ui.liveState = state; ui.liveMsg = msg || ''; const m = $('liveMsg'); if (m){ m.hidden = !msg; m.textContent = msg || ''; m.className = 'msg ' + (state === 'error' ? 'bad' : state === 'live' ? 'good' : ''); } invalidate(); }
function stopLive(){ live.gen++; clearTimeout(live.retry); clearInterval(live.pollM); clearInterval(live.pollN); if (live.ws){ try { live.ws.onclose = null; live.ws.close(); } catch (e){} live.ws = null; } }
async function connectLive(){
  stopLive(); stopSim();
  const gen = live.gen;
  if (!keys.id || !keys.secret){ settings.mode = 'sim'; saveSettings(); startSim(); setLive('error', 'Enter your Alpaca key ID and secret first.'); return; }
  settings.mode = 'live'; saveSettings(); setLive('connecting', 'Loading recent bars from Alpaca…');
  try {
    const all = []; let token = null, pages = 0;
    do {
      const r = await api('/v2/stocks/bars', {symbols:symbols.join(','), timeframe:'1Min', start:new Date(Date.now() - 6 * 86400000).toISOString(), limit:10000, feed:settings.feed, adjustment:'raw', sort:'asc', page_token:token});
      if (gen !== live.gen) return;
      for (const [sym, bars] of Object.entries(r.bars || {})) for (const b of bars) all.push([sym, {t:Date.parse(b.t), o:b.o, h:b.h, l:b.l, c:b.c, v:b.v}]);
      token = r.next_page_token;
    } while (token && ++pages < 40);
    engine.reset(); notes.length = 0;
    all.sort((a, b) => a[1].t - b[1].t || (a[0] === 'SPY' ? -1 : b[0] === 'SPY' ? 1 : 0));
    let latest = ''; for (const [, b] of all){ const p = ET.parts(b.t); if (p.min >= 570 && p.min < 960 && p.key > latest) latest = p.key; }
    engine.alertFrom = latest;
    for (const [sym, b] of all) engine.onBar(sym, b, {});
  } catch (e){
    if (gen !== live.gen) return;
    const msg = explain(e); settings.mode = 'sim'; saveSettings(); startSim(); setLive('error', msg); return;
  }
  openSocket(gen);
  market.movers = null; news.market = null; news.mine = null;
  loadMarket(); loadNews();
  live.pollM = setInterval(() => { if (!document.hidden && ui.view === 'rankings') loadMarket(); }, 60000);
  live.pollN = setInterval(() => { if (!document.hidden && ui.view === 'news') loadNews(); }, 180000);
}
function openSocket(gen){
  let ws; try { ws = new WebSocket('wss://stream.data.alpaca.markets/v2/' + settings.feed); } catch (e){ setLive('error', 'Could not open the live stream from this page.'); return; }
  live.ws = ws;
  ws.onmessage = ev => {
    if (gen !== live.gen) return;
    let arr; try { arr = JSON.parse(ev.data); } catch (e){ return; }
    let got = false;
    for (const m of [].concat(arr)){
      if (m.T === 'success' && m.msg === 'connected') ws.send(JSON.stringify({action:'auth', key:keys.id, secret:keys.secret}));
      else if (m.T === 'success' && m.msg === 'authenticated') ws.send(JSON.stringify({action:'subscribe', bars:symbols}));
      else if (m.T === 'subscription') setLive('live', `Connected. Streaming one-minute bars for ${symbols.length} symbols on ${settings.feed.toUpperCase()}.`);
      else if (m.T === 'error') setLive('error', m.code === 405 ? 'Alpaca says the symbol limit for your plan is exceeded. Remove some symbols.' : m.code === 406 ? 'Alpaca allows one live stream at a time on this plan, and another one is already open. Close Pocket Scanner or any other copy, then connect again.' : 'Stream error: ' + (m.msg || m.code));
      else if (m.T === 'b'){ engine.onBar(m.S, {t:Date.parse(m.t), o:m.o, h:m.h, l:m.l, c:m.c, v:m.v}, {live:true}); got = true; }
    }
    if (got) invalidate();
  };
  ws.onclose = () => { if (gen !== live.gen) return; if (ui.liveState === 'live' || ui.liveState === 'connecting'){ setLive('connecting', 'Stream dropped. Reconnecting in 10 seconds…'); live.retry = setTimeout(() => { if (gen === live.gen) openSocket(gen); }, 10000); } };
  ws.onerror = () => {};
}
async function loadMarket(){
  try { const [mv, ac] = await Promise.all([api('/v1beta1/screener/stocks/movers', {top:20}), api('/v1beta1/screener/stocks/most-actives', {top:20, by:'volume'})]); market.movers = mv; market.actives = ac.most_actives || []; market.err = ''; }
  catch (e){ market.err = 'Could not load the market-wide list from Alpaca. Your own symbols still rank under My symbols.'; }
  invalidate();
}
async function loadNews(){
  try {
    const [a, b] = await Promise.all([api('/v1beta1/news', {limit:40, sort:'desc'}), api('/v1beta1/news', {limit:40, sort:'desc', symbols:symbols.join(',')})]);
    news.market = a.news || []; news.mine = b.news || []; news.err = '';
  } catch (e){ news.err = 'Could not load headlines from Alpaca.'; }
  invalidate();
}

/* ---------- events ---------- */
const VIEWS = ['alerts', 'setups', 'rankings', 'news'];
function setView(v){ ui.view = VIEWS.includes(v) ? v : 'alerts'; if (ui.view === 'alerts') ui.unseen = 0; $('main').scrollTop = 0; render(); }
window.addEventListener('hashchange', () => setView(location.hash.slice(1)));
document.addEventListener('click', e => {
  const actEl = e.target.closest('[data-act]'), sigEl = e.target.closest('[data-sig]'), symEl = e.target.closest('[data-sym]');
  if (!actEl && sigEl){ const g = engine.signals.find(x => x.id === +sigEl.dataset.sig); if (g) openInfo(g.sym, g.id); return; }
  if (!actEl && symEl){ e.preventDefault(); openInfo(symEl.dataset.sym); return; }
  if (!actEl) return;
  const act = actEl.dataset.act, id = actEl.dataset.id;
  if (act === 'close-sheet') closeSheet();
  else if (act === 'open-settings') openSettings();
  else if (act === 'open-calc') openCalc();
  else if (act === 'show-all'){ ui.showAll = actEl.getAttribute('aria-pressed') === 'true' ? ui.showAll : !ui.showAll; render(); }
  else if (act === 'rank'){ ui.rank = id; render(); }
  else if (act === 'toggle-setup'){ settings.on[id] = !settings.on[id]; saveSettings(); render(); }
  else if (act === 'connect'){
    keys = {id:$('kId').value.trim(), secret:$('kSecret').value.trim()}; settings.feed = $('kFeed').value; settings.remember = $('kRemember').checked; keysFromPocket = false;
    if (settings.remember) store.set('keys', keys); else store.del('keys');
    if (settings.feed === 'iex' && symbols.length > 30){ symbols = symbols.slice(0, 30); store.set('symbols', symbols); }
    saveSettings(); connectLive();
  }
  else if (act === 'forget'){ keys = {id:'', secret:''}; keysFromPocket = false; store.del('keys'); $('kId').value = ''; $('kSecret').value = ''; if (settings.mode === 'live'){ settings.mode = 'sim'; saveSettings(); startSim(); } setLive('off', 'Keys removed from Loot Drop on this device. Pocket Scanner keeps its own copy.'); $('mSim').checked = true; }
  else if (act === 'rm-sym'){ symbols = symbols.filter(s => s !== id); engine.states.delete(id); symbolsChanged(); }
  else if (act === 'add-syms') addSymbols($('symAdd').value);
  else if (act === 'add-sym'){ addSymbols(id); closeSheet(); }
  else if (act === 'refresh-news'){ news[ui.newsScope] = null; render(); loadNews(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'minScore'){ settings.minScore = +t.value; $('minScoreVal').textContent = t.value; saveSettings(); }
  else if (ui.sheet && ui.sheet.type === 'calc' && ['cEq', 'cRisk', 'cEntry', 'cStop'].includes(t.id)) calc();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'mode' && ui.sheet && ui.sheet.type === 'settings'){
    if (t.value === 'sim'){ settings.mode = 'sim'; saveSettings(); ui.liveState = 'off'; startSim(); }
    else { keys = {id:$('kId').value.trim(), secret:$('kSecret').value.trim()}; connectLive().then(() => { if (settings.mode === 'sim' && $('mSim')) $('mSim').checked = true; }); }
  }
  else if (t.name === 'chartRange' && ui.sheet){ ui.sheet.range = t.value; renderInfo(); }
  else if (t.name === 'scope'){ ui.scope = t.value; render(); }
  else if (t.name === 'newsScope'){ ui.newsScope = t.value; render(); }
  else if (t.id === 'optSound'){ settings.sound = t.checked; saveSettings(); if (t.checked){ try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); beep(); } catch (err){} } }
  else if (t.id === 'optAwake'){ settings.awake = t.checked; saveSettings(); setAwake(t.checked); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); if (e.key === 'Enter' && e.target.id === 'symAdd') addSymbols(e.target.value); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && settings.awake) setAwake(true); });
setInterval(renderStatus, 1000);

/* ---------- start ---------- */
ui.view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'alerts';
if (settings.mode === 'live' && keys.id && keys.secret){ startSim(); connectLive(); } else { settings.mode = 'sim'; startSim(); }
</script>
</body>
</html>
